services:
  web:
    image: nginx:latest
    container_name: s7-nginx
    ports:
      - "8090:80"
    networks:
      - red_s7
    depends_on:
      - app

  app:
    image: httpd:2.4
    container_name: s7-app
    environment:
      - DB_HOST=db
      - DB_NAME=appdb
      - DB_USER=appuser
      - DB_PASSWORD=${DB_PASSWORD}
    networks:
      - red_s7
    depends_on:
      - db

  db:
    image: mariadb:11
    container_name: s7-db
    environment:
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
      - MARIADB_DATABASE=appdb
      - MARIADB_USER=appuser
      - MARIADB_PASSWORD=${DB_PASSWORD}
    volumes:
      - datos_db:/var/lib/mysql
    networks:
      - red_s7

networks:
  red_s7:

volumes:
  datos_db:
