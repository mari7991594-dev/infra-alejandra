<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Infraestructura de Alejandra</title>
  <style>
    :root { --fondo: #fdf2f8; --principal: #be185d; --texto: #1f2937; }
    body { margin: 0; font-family: Arial, sans-serif; background: var(--fondo); color: var(--texto); }
    header { background: var(--principal); color: white; padding: 40px 20px; text-align: center; }
    main { max-width: 700px; margin: 30px auto; padding: 0 20px; }
    .tarjeta { background: white; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h2 { color: var(--principal); margin-top: 0; }
  </style>
</head>
<body>
  <header>
    <h1>Infraestructura de Alejandra</h1>
    <p>Administración de Centros de Cómputo</p>
  </header>
  <main>
    <div class="tarjeta"><h2>Servicios</h2><p>Nginx, Apache httpd y MariaDB con Docker Compose.</p></div>
    <div class="tarjeta"><h2>Scripts</h2><p>Respaldo con cron y reporte del sistema en Python.</p></div>
  </main>
</body>
</html>
