name: proyecto-integrador

services:
  web1:
    image: nginx
    container_name: web1
    restart: unless-stopped
    ports:
      - "8080:80"

  web3:
    image: nginx
    container_name: web3
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - datos-lab:/usr/share/nginx/html

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      N8N_EDITOR_BASE_URL: "http://192.168.1.200:5678"
      N8N_SECURE_COOKIE: "false"
      WEBHOOK_URL: "http://192.168.1.200:5678/"
    volumes:
      - n8n_data:/home/node/.n8n

  portainer:
    image: portainer/portainer-ce:lts
    container_name: portainer
    restart: always
    ports:
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

volumes:
  datos-lab:
    external: true
  n8n_data:
    external: true
  portainer_data:
    external: true
